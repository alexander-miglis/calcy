<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calcy Programmer mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Pixelify+Sans:wght@400;600;700&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="{{vars}} min-height: 880px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Pixelify Sans', monospace; color: var(--on-ground); background-color: var(--ground); background-image: repeating-conic-gradient(var(--ground2) 0% 25%, var(--ground) 0% 50%); background-size: 8px 8px">
  <dc-import name="TopBar" mode="Programmer" scheme="{{scheme}}" on-scheme="{{setScheme}}" preview-open="{{closed}}" hint-size="100%,68px"></dc-import>
  <main style="flex: 1; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; box-sizing: border-box; align-items: flex-start">

    <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div role="tablist" aria-label="Programmer views" style="display: flex; gap: 8px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="font-family: 'Silkscreen', monospace; font-size: 13px; color: var(--ink); min-height: 44px; padding: 0 16px; border: 3px solid var(--line); box-shadow: 3px 3px 0 0 var(--line); cursor: pointer; background-color: {{t.bg}}">{{t.label}}</button>
        </sc-for>
      </div>

      <sc-if value="{{isInt}}" hint-placeholder-val="{{ true }}">
        <section aria-label="Value in every base" style="background-color: var(--paper); color: var(--ink); border: 4px solid var(--line); box-shadow: 6px 6px 0 0 var(--line)">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; background-color: var(--head); border-bottom: 4px solid var(--line)">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px">{{pendingText}}</span>
            <div style="display: flex; gap: 12px; flex-wrap: wrap">
              <div role="group" aria-label="Word size" style="display: flex">
                <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
                  <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="font-family: 'Silkscreen', monospace; font-size: 12px; color: var(--ink); min-width: 48px; min-height: 36px; border: 2px solid var(--line); margin-right: -2px; cursor: pointer; background-color: {{s.bg}}">{{s.label}}</button>
                </sc-for>
              </div>
              <div role="group" aria-label="Signedness" style="display: flex">
                <button type="button" onClick="{{setSigned}}" aria-pressed="{{signedPressed}}" style="font-family: 'Silkscreen', monospace; font-size: 12px; color: var(--ink); min-height: 36px; padding: 0 10px; border: 2px solid var(--line); margin-right: -2px; cursor: pointer; background-color: {{signedBg}}">Signed</button>
                <button type="button" onClick="{{setUnsigned}}" aria-pressed="{{unsignedPressed}}" style="font-family: 'Silkscreen', monospace; font-size: 12px; color: var(--ink); min-height: 36px; padding: 0 10px; border: 2px solid var(--line); cursor: pointer; background-color: {{unsignedBg}}">Unsigned</button>
              </div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column">
            <sc-for list="{{bases}}" as="b" hint-placeholder-count="4">
              <button type="button" onClick="{{b.pick}}" aria-pressed="{{b.pressed}}" style="display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 14px; text-align: left; padding: 10px 14px; min-height: 52px; border: 0; border-bottom: 2px solid var(--key); cursor: pointer; color: var(--ink); background-color: {{b.bg}}">
                <span style="font-family: 'Silkscreen', monospace; font-size: 14px">{{b.label}}</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: {{b.size}}; font-weight: 600; overflow-wrap: anywhere">{{b.value}}</span>
              </button>
            </sc-for>
          </div>
        </section>

        <section aria-label="Bits" style="background-color: var(--paper); color: var(--ink); border: 4px solid var(--line); box-shadow: 6px 6px 0 0 var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 12px"><span>Bits: click to flip</span><span>{{bitInfo}}</span></div>
          <sc-for list="{{bitRows}}" as="row" hint-placeholder-count="1">
            <div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px">
              <sc-for list="{{row.bits}}" as="bit" hint-placeholder-count="16">
                <button type="button" onClick="{{bit.flip}}" aria-label="{{bit.aria}}" aria-pressed="{{bit.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px 0; min-height: 44px; border: 2px solid var(--line); cursor: pointer; font-family: 'JetBrains Mono', monospace; color: {{bit.fg}}; background-color: {{bit.bg}}; margin-left: {{bit.gap}}">
                  <span style="font-size: 16px; font-weight: 700">{{bit.v}}</span>
                  <span style="font-size: 9px">{{bit.i}}</span>
                </button>
              </sc-for>
            </div>
          </sc-for>
        </section>

        <section aria-label="Keypad" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{keys}}" as="k" hint-placeholder-count="38">
            <button type="button" onClick="{{k.press}}" disabled="{{k.disabled}}" style="font-family: 'Silkscreen', monospace; font-size: 15px; color: {{k.fg}}; min-height: 48px; border: 3px solid var(--line); box-shadow: 3px 3px 0 0 var(--line); cursor: pointer; background-color: {{k.bg}}">{{k.label}}</button>
          </sc-for>
        </section>
      </sc-if>

      <sc-if value="{{isFloat}}" hint-placeholder-val="{{ false }}">
        <section aria-label="Float inspector" style="background-color: var(--paper); color: var(--ink); border: 4px solid var(--line); box-shadow: 6px 6px 0 0 var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px">
          <label style="display: flex; align-items: center; gap: 12px; font-family: 'Silkscreen', monospace; font-size: 13px">Number
            <input type="text" value="{{floatText}}" onChange="{{setFloat}}" style="font-family: 'JetBrains Mono', monospace; font-size: 22px; min-height: 44px; border: 3px solid var(--line); padding: 0 10px; width: 220px; background-color: var(--card); color: var(--ink)">
            <span style="font-family: 'Pixelify Sans', monospace; font-size: 15px; color: var(--muted)">IEEE 754 double (64 bits)</span>
          </label>
          <div style="display: flex; flex-wrap: wrap; gap: 3px">
            <sc-for list="{{floatBits}}" as="fb" hint-placeholder-count="64">
              <span style="width: 16px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; border: 2px solid var(--line); padding: 4px 0; color: var(--ink); background-color: {{fb.bg}}">{{fb.v}}</span>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <div style="border: 3px solid var(--line); padding: 10px; background-color: var(--mem)"><div style="font-family: 'Silkscreen', monospace; font-size: 12px">Sign</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 18px">{{fSign}}</div></div>
            <div style="border: 3px solid var(--line); padding: 10px; background-color: var(--sel)"><div style="font-family: 'Silkscreen', monospace; font-size: 12px">Exponent</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 18px">{{fExp}}</div></div>
            <div style="border: 3px solid var(--line); padding: 10px; background-color: var(--head)"><div style="font-family: 'Silkscreen', monospace; font-size: 12px">Mantissa</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 18px">{{fMan}}</div></div>
          </div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 16px">Stored exactly as {{fExact}}</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 16px">Hex 0x{{fHex}}</div>
        </section>
      </sc-if>

      <sc-if value="{{isText}}" hint-placeholder-val="{{ false }}">
        <section aria-label="Characters and encodings" style="background-color: var(--paper); color: var(--ink); border: 4px solid var(--line); box-shadow: 6px 6px 0 0 var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px">
          <label style="display: flex; align-items: center; gap: 12px; font-family: 'Silkscreen', monospace; font-size: 13px">Text
            <input type="text" value="{{text}}" onChange="{{setText}}" style="font-family: 'JetBrains Mono', monospace; font-size: 22px; min-height: 44px; border: 3px solid var(--line); padding: 0 10px; width: 320px; background-color: var(--card); color: var(--ink)">
          </label>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{chars}}" as="c" hint-placeholder-count="5">
              <div style="border: 3px solid var(--line); background-color: var(--card); padding: 8px; display: flex; flex-direction: column; gap: 2px; font-family: 'JetBrains Mono', monospace">
                <span style="font-size: 26px; font-weight: 700">{{c.ch}}</span>
                <span style="font-size: 13px">U+{{c.cp}}  ({{c.dec}})</span>
                <span style="font-size: 13px; color: var(--muted)">UTF-8 {{c.utf8}}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-if>
    </div>

    <aside aria-label="Programmer cards" style="flex: 1 1 320px; max-width: 380px; background-color: var(--paper); color: var(--ink); border: 4px solid var(--line); box-shadow: 6px 6px 0 0 var(--line); display: flex; flex-direction: column; max-height: 760px">
      <h2 style="margin: 0; padding: 10px 14px; background-color: var(--ok); border-bottom: 4px solid var(--line); font-family: 'Silkscreen', monospace; font-size: 14px">Cards</h2>
      <div style="padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
          <article style="border: 3px solid var(--line); background-color: var(--card); box-shadow: 3px 3px 0 0 var(--line)">
            <div style="padding: 4px 10px; background-color: var(--key); border-bottom: 2px solid var(--line); font-family: 'Silkscreen', monospace; font-size: 11px">#{{c.n}}  {{c.ctx}}</div>
            <div style="padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-family: 'JetBrains Mono', monospace">
              <span style="font-size: 14px; color: var(--muted)">{{c.expr}}</span>
              <span style="font-size: 20px; font-weight: 700">= {{c.result}}</span>
            </div>
          </article>
        </sc-for>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scheme":{"editor":"enum","default":"nes","options":["nes","pico","gameboy","c64","amber","paper","mono","synth"]},"$preview":{"width":1360,"height":880}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      val: 0xB5n, bits: 16, signed: true, base: 'HEX', pend: null, tab: 'Integer', float: '0.1', text: 'Calcy',
      cards: [
        { expr: '0xFF AND 0x0F', result: '0x0F', ctx: '16-bit signed' },
        { expr: '1 << 10', result: '1024', ctx: '16-bit signed' },
        { expr: 'NOT 0', result: '-1  (0xFFFF)', ctx: '16-bit signed' },
        { expr: '0x7FFF + 1', result: '-32768  (overflow wraps)', ctx: '16-bit signed' },
        { expr: '255 as 8-bit signed', result: '-1', ctx: '8-bit signed' }
      ]
    };
  }
  schemeList() {
    return {
      nes: ['NES Classic', '#1C1C1C #262626 #FCFCFC #000000 #FCFCFC #F83800 #FCFCFC #FFFFFF #000000 #595959 #000000 #3CBCFC #F8B800 #F83800 #BCBCBC #F878F8 #58D854 #D82800 #000000 #FCFCFC #BCBCBC #000000 #A4A4A4 #E4E4E4 #0058F8 #D82800 #00A800 #6844FC #AC7C00'],
      pico: ['Pico Night', '#1D2B53 #22325F #FFF1E8 #000000 #FFF1E8 #29ADFF #FFF1E8 #FFFFFF #1D2B53 #5F574F #000000 #29ADFF #FFEC27 #FFA300 #C2C3C7 #FF77A8 #00E436 #FF004D #1D2B53 #FFF1E8 #9BBC0F #0F380F #8BAC0F #E5D7CC #1E5AC8 #FF004D #008751 #7E2553 #AB5236'],
      gameboy: ['Game Boy', '#0F380F #133F13 #9BBC0F #0F380F #9BBC0F #8BAC0F #9BBC0F #CADC9F #0F380F #1B431B #0F380F #8BAC0F #E0F8D0 #CADC9F #A8C46A #C8E0A0 #B4D27A #0F380F #0F380F #9BBC0F #9BBC0F #0F380F #8BAC0F #B5C97A #0F380F #306230 #5A7D1A #1E4D1E #6E5A12'],
      c64: ['C64 Blue', '#352879 #3D2F88 #C9C3F5 #20165C #C9C3F5 #6C5EB5 #C9C3F5 #E6E2FF #20165C #463B8E #20165C #9A8EE0 #EEEE77 #DD8855 #ADADAD #E0A3D8 #AAFF66 #883932 #352879 #FFFFFF #6C5EB5 #FFFFFF #5A4CA6 #D6D1F7 #40318D #883932 #3E7A33 #8B3F96 #9C6A20'],
      amber: ['Amber CRT', '#0A0700 #140E00 #FFB000 #000000 #FFB000 #FFB000 #1A1200 #241A02 #FFB000 #C98A00 #A06E00 #3D2A00 #644500 #573C00 #2E2100 #4A2B10 #2F3A00 #FF5A1F #0A0700 #FFB000 #1A1200 #FFB000 #120D00 #3A2A00 #FFB000 #FF6A00 #FFE08A #D98E04 #FFF4CC'],
      paper: ['Paper', '#E9E4D6 #E1DBCB #2B2B2B #2B2B2B #F7F4EC #E4572E #F7F4EC #FFFFFF #2B2B2B #6B645A #2B2B2B #A8D5BA #FFD166 #F4A259 #D9D4C7 #F7A6C4 #9BE38E #D7263D #2B2B2B #F7F4EC #C7D1B1 #2B2B2B #B9C3A2 #ECE6D9 #2D6CDF #D7263D #2A9D5F #7B4FB8 #B5651D'],
      mono: ['High contrast', '#000000 #141414 #FFFFFF #000000 #FFFFFF #FFFFFF #FFFFFF #FFFFFF #000000 #3A3A3A #000000 #D9D9D9 #FFF000 #BFBFBF #EDEDED #CFCFCF #E3E3E3 #000000 #000000 #FFFFFF #E6E6E6 #000000 #D0D0D0 #E6E6E6 #000000 #4D4D4D #000000 #6E6E6E #262626'],
      synth: ['Synthwave', '#1B0B33 #241044 #FFE3F5 #0E0420 #FFE3F5 #FF4FD8 #2A1452 #351A66 #FFE3F5 #C9A8E8 #0E0420 #6B2FB5 #9D1789 #B8360B #3D2470 #8E1A72 #136B4F #FF4F6D #0E0420 #FFE3F5 #2A1452 #4FD8FF #22103F #3A2266 #4FD8FF #FF4FD8 #7CFF6B #FFD24F #FF8A4F']
    };
  }
  schemeVars(id) {
    const keys = 'ground ground2 on-ground bar bar-ink bar-accent paper card ink muted line head sel primary key mem ok err off off-ink lcd lcd-ink lcd-shade grid g1 g2 g3 g4 g5'.split(' ');
    const all = this.schemeList();
    const v = (all[id] || all.nes)[1].split(' ');
    return keys.map((k, i) => '--' + k + ': ' + v[i] + ';').join(' ');
  }
  storedScheme() { try { return window.localStorage.getItem('calcy-scheme'); } catch (e) { return null; } }
  useScheme(id) { try { window.localStorage.setItem('calcy-scheme', id); } catch (e) {} this.setState({ scheme: id }); }
  componentDidUpdate(prev) { if (prev.scheme !== this.props.scheme && this.props.scheme) this.setState({ scheme: this.props.scheme }); }
  mask() { return (1n << BigInt(this.state.bits)) - 1n; }
  signedVal(v) {
    const b = BigInt(this.state.bits);
    return this.state.signed && v >= (1n << (b - 1n)) ? v - (1n << b) : v;
  }
  group(s, n) {
    let out = '';
    for (let i = 0; i < s.length; i++) {
      if (i > 0 && (s.length - i) % n === 0) out += ' ';
      out += s[i];
    }
    return out;
  }
  show(v, base) {
    if (base === 'HEX') return this.group(v.toString(16).toUpperCase(), 4);
    if (base === 'DEC') return this.signedVal(v).toString();
    if (base === 'OCT') return v.toString(8);
    return this.group(v.toString(2).padStart(this.state.bits, '0'), 4);
  }
  radix() { return { HEX: 16n, DEC: 10n, OCT: 8n, BIN: 2n }[this.state.base]; }
  binop(a, op, b) {
    const m = this.mask();
    switch (op) {
      case 'AND': return a & b;
      case 'OR': return a | b;
      case 'XOR': return a ^ b;
      case 'NAND': return ~(a & b) & m;
      case 'NOR': return ~(a | b) & m;
      case '+': return (a + b) & m;
      case '−': return (a - b) & m;
      case '×': return (a * b) & m;
      case '÷': return b === 0n ? a : (this.state.signed ? BigInt.asUintN(this.state.bits, this.signedVal(a) / this.signedVal(b)) : a / b);
      case 'MOD': return b === 0n ? a : a % b;
      case '<<': return (a << b) & m;
      case '>>': return a >> b;
      default: return b;
    }
  }
  press(k) {
    const s = this.state, m = this.mask(), n = BigInt(s.bits);
    const digit = '0123456789ABCDEF'.indexOf(k);
    if (k.length === 1 && digit >= 0) {
      const r = this.radix();
      if (BigInt(digit) >= r) return;
      const start = s.fresh ? 0n : s.val;
      this.setState({ val: (start * r + BigInt(digit)) & m, fresh: false });
      return;
    }
    if (['AND', 'OR', 'XOR', 'NAND', 'NOR', '+', '−', '×', '÷', 'MOD', '<<', '>>'].includes(k)) {
      const a = s.pend ? this.binop(s.pend.a, s.pend.op, s.val) : s.val;
      this.setState({ pend: { a, op: k }, val: a, fresh: true });
      return;
    }
    if (k === '=') {
      if (!s.pend) return;
      const r = this.binop(s.pend.a, s.pend.op, s.val);
      const card = { expr: this.show(s.pend.a, s.base) + ' ' + s.pend.op + ' ' + this.show(s.val, s.base), result: this.show(r, s.base), ctx: s.bits + '-bit ' + (s.signed ? 'signed' : 'unsigned') };
      this.setState({ val: r, pend: null, fresh: true, cards: [card, ...s.cards] });
      return;
    }
    if (k === 'NOT') this.setState({ val: ~s.val & m, fresh: true });
    else if (k === 'ROL') this.setState({ val: ((s.val << 1n) | (s.val >> (n - 1n))) & m, fresh: true });
    else if (k === 'ROR') this.setState({ val: ((s.val >> 1n) | ((s.val & 1n) << (n - 1n))) & m, fresh: true });
    else if (k === '±') this.setState({ val: (-s.val) & m, fresh: true });
    else if (k === 'C') this.setState({ val: 0n, pend: null, fresh: true });
    else if (k === '⌫') this.setState({ val: s.val / this.radix() });
  }
  floatInfo() {
    const x = parseFloat(this.state.float);
    const buf = new DataView(new ArrayBuffer(8));
    buf.setFloat64(0, isNaN(x) ? NaN : x);
    let bits = '';
    for (let i = 0; i < 8; i++) bits += buf.getUint8(i).toString(2).padStart(8, '0');
    let hex = '';
    for (let i = 0; i < 8; i++) hex += buf.getUint8(i).toString(16).padStart(2, '0').toUpperCase();
    const e = parseInt(bits.slice(1, 12), 2);
    return {
      floatBits: bits.split('').map((v, i) => ({ v, bg: i === 0 ? 'var(--mem)' : i < 12 ? 'var(--sel)' : 'var(--head)' })),
      fSign: bits[0] === '1' ? '1 (negative)' : '0 (positive)',
      fExp: e + ' − 1023 = ' + (e - 1023),
      fMan: '1.' + bits.slice(12, 24) + '…',
      fExact: isFinite(x) ? x.toPrecision(25).replace(/0+$/, '') : String(x),
      fHex: this.group(hex, 4)
    };
  }
  renderVals() {
    const s = this.state;
    const sc = s.scheme ?? this.storedScheme() ?? this.props.scheme ?? 'nes';
    const tabs = ['Integer', 'Float', 'Text'];
    const n = s.bits;
    const bitRows = [];
    for (let r = 0; r < Math.ceil(n / 16); r++) {
      const bits = [];
      for (let c = 0; c < 16; c++) {
        const i = n - 1 - (r * 16 + c);
        if (i < 0) continue;
        const on = ((s.val >> BigInt(i)) & 1n) === 1n;
        bits.push({ v: on ? '1' : '0', i, aria: 'bit ' + i + (on ? ' on' : ' off'), pressed: on ? 'true' : 'false', bg: on ? 'var(--sel)' : 'var(--off)', fg: on ? 'var(--ink)' : 'var(--off-ink)', gap: c > 0 && c % 4 === 0 ? '6px' : '0', flip: () => this.setState({ val: s.val ^ (1n << BigInt(i)), fresh: true }) });
      }
      bitRows.push({ bits });
    }
    const keyDefs = [
      'A', 'B', 'C', 'D', 'E', 'F', 'AND', 'OR',
      '7', '8', '9', '÷', 'MOD', '(', 'XOR', 'NOT',
      '4', '5', '6', '×', '<<', ')', 'NAND', 'NOR',
      '1', '2', '3', '−', '>>', '⌫', 'ROL', 'ROR',
      '±', '0', '.', '+', '=', 'C'
    ];
    const r = Number(this.radix());
    const keys = keyDefs.map(k => {
      const d = '0123456789ABCDEF'.indexOf(k);
      const isDigit = k.length === 1 && d >= 0;
      const disabled = (isDigit && d >= r) || k === '.' || k === '(' || k === ')';
      const kind = isDigit ? 'd' : k === '=' ? 'e' : k === 'C' ? 'c' : ['AND', 'OR', 'XOR', 'NOT', 'NAND', 'NOR', '<<', '>>', 'ROL', 'ROR'].includes(k) ? 'b' : 'o';
      const bg = disabled ? 'var(--key)' : { d: 'var(--paper)', e: 'var(--primary)', c: 'var(--paper)', b: 'var(--ok)', o: 'var(--head)' }[kind];
      return { label: k, disabled, bg, fg: disabled ? 'var(--muted)' : 'var(--ink)', press: () => this.press(k) };
    });
    return {
      vars: this.schemeVars(sc),
      scheme: sc,
      setScheme: (id) => this.useScheme(id),
      closed: false,
      tabs: tabs.map(t => ({ label: t, selected: t === s.tab ? 'true' : 'false', bg: t === s.tab ? 'var(--sel)' : 'var(--paper)', pick: () => this.setState({ tab: t }) })),
      isInt: s.tab === 'Integer', isFloat: s.tab === 'Float', isText: s.tab === 'Text',
      sizes: [8, 16, 32, 64].map(b => ({ label: String(b), pressed: b === n ? 'true' : 'false', bg: b === n ? 'var(--sel)' : 'var(--paper)', pick: () => this.setState({ bits: b, val: s.val & ((1n << BigInt(b)) - 1n) }) })),
      signedPressed: s.signed ? 'true' : 'false', unsignedPressed: s.signed ? 'false' : 'true',
      signedBg: s.signed ? 'var(--sel)' : 'var(--paper)', unsignedBg: s.signed ? 'var(--paper)' : 'var(--sel)',
      setSigned: () => this.setState({ signed: true }), setUnsigned: () => this.setState({ signed: false }),
      pendingText: s.pend ? this.show(s.pend.a, s.base) + ' ' + s.pend.op + ' …' : 'Input base: ' + s.base + '. Type 0x, 0b or 0o to switch.',
      bases: ['HEX', 'DEC', 'OCT', 'BIN'].map(b => ({ label: b, value: this.show(s.val, b), pressed: b === s.base ? 'true' : 'false', bg: b === s.base ? 'var(--sel)' : 'var(--paper)', size: b === 'BIN' ? '18px' : '26px', pick: () => this.setState({ base: b, fresh: true }) })),
      bitRows,
      bitInfo: 'set bits: ' + s.val.toString(2).split('').filter(c => c === '1').length + ' of ' + n,
      keys,
      cards: s.cards.map((c, i) => ({ ...c, n: s.cards.length - i })),
      ...this.floatInfo(),
      floatText: s.float,
      setFloat: (e) => this.setState({ float: e.target.value }),
      text: s.text,
      setText: (e) => this.setState({ text: e.target.value }),
      chars: Array.from(s.text).slice(0, 8).map(ch => {
        const cp = ch.codePointAt(0);
        const utf8 = Array.from(new TextEncoder().encode(ch)).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
        return { ch, cp: cp.toString(16).toUpperCase().padStart(4, '0'), dec: cp, utf8 };
      })
    };
  }
}
</script>
