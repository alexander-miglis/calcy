# Builds, tests and packages Calcy for Windows, macOS and Linux. Runs only when started by hand
# (Actions > Release > Run workflow).
#
# Versioning: the base version is <VersionPrefix> in Directory.Build.props (or the "version" input).
#   channel = prerelease  ->  0.1.0-pre.<run number>   (deb 0.1.0~pre.N, rpm 0.1.0-0.pre.N)
#   channel = release     ->  0.1.0                    (tag v0.1.0; the run fails if that tag exists)
# Every build stamps the version and commit into the programs (calcy --version, calcy-cli --version).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version x.y.z (empty: VersionPrefix from Directory.Build.props)'
        required: false
        default: ''
      channel:
        description: 'prerelease adds -pre.<run number>; release builds the exact version'
        type: choice
        options: [prerelease, release]
        default: prerelease
      create_release:
        description: 'Create a draft GitHub release with the packages'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      file_version: ${{ steps.v.outputs.file_version }}
      base: ${{ steps.v.outputs.base }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Work out the version
        shell: bash
        run: |
          set -euo pipefail
          base="${{ inputs.version }}"
          if [ -z "$base" ]; then
            base=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)
          fi
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$base' is not of the form x.y.z"
            exit 1
          fi
          run=${{ github.run_number }}
          if [ "${{ inputs.channel }}" = "release" ]; then
            version="$base"
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists. Bump VersionPrefix in Directory.Build.props or pass another version."
              exit 1
            fi
          else
            version="$base-pre.$run"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "file_version=$base.$((run % 65535))" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "### Calcy $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$(git rev-parse --short HEAD)\`, channel ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fonts for the headless screen tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig
      - name: Build
        run: dotnet build Calcy.slnx -c Release
      - name: Test
        run: dotnet test Calcy.slnx -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  build:
    name: Build ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Publish and package
        shell: pwsh
        run: >
          ./build/package.ps1 -Rid ${{ matrix.rid }}
          -Version ${{ needs.version.outputs.version }}
          -FileVersion ${{ needs.version.outputs.file_version }}
          -Commit ${{ needs.version.outputs.commit }}
          -Output artifacts
      - name: Sign the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          EXPECTED_FINGERPRINT: ${{ vars.LINUX_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::The LINUX_SIGNING_KEY secret is not set, so the Linux packages are not signed."
            exit 0
          fi
          export GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          published=$(gpg --batch --with-colons --import-options show-only --import build/linux/calcy-signing-key.asc | awk -F: '/^fpr/ {print $10; exit}')
          # Users verify with the public key in the repository, so the secret must be the same key.
          if [ "$fpr" != "$published" ]; then
            echo "::error::The signing key ($fpr) is not the one in build/linux/calcy-signing-key.asc ($published)."
            exit 1
          fi
          if [ -n "$EXPECTED_FINGERPRINT" ] && [ "$fpr" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::The signing key ($fpr) does not match the LINUX_SIGNING_FINGERPRINT variable ($EXPECTED_FINGERPRINT)."
            exit 1
          fi
          # Embedded rpm signatures, checked by rpm -K and by dnf once the key is imported.
          rpmsign --define "_gpg_name $fpr" --define "_gpg_digest_algo sha256" --addsign artifacts/*.rpm
          rpmdb=$(mktemp -d)
          rpm --dbpath "$rpmdb" --initdb
          rpmkeys --dbpath "$rpmdb" --import build/linux/calcy-signing-key.asc
          rpmkeys --dbpath "$rpmdb" --checksig artifacts/*.rpm
          # Detached signatures for every Linux package, verified straight away.
          for f in artifacts/*.rpm artifacts/*.deb artifacts/*.tar.gz; do
            gpg --batch --yes --local-user "$fpr" --armor --detach-sign --output "$f.asc" "$f"
            gpg --batch --verify "$f.asc" "$f"
          done
          cp build/linux/calcy-signing-key.asc artifacts/
          echo "Signed with $fpr" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $dir = 'artifacts/work-win-x64/publish'
          $out = & "$dir/calcy-cli.exe" eval "1/3 + 1/6"
          if ($out -notmatch '^1/2') { throw "calcy-cli printed '$out'" }
          Start-Process -FilePath "$dir/Calcy.exe" -ArgumentList @('--screenshot', 'graphing', "$PWD/shot-windows.png", '--input', 'y = sin(x)') -Wait -NoNewWindow
          if (-not (Test-Path shot-windows.png)) { throw 'The app did not render a screenshot' }
      - name: Smoke test (macOS)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          set -euo pipefail
          app=artifacts/work-osx-arm64/Calcy.app/Contents/MacOS
          out=$("$app/calcy-cli" eval "1/3 + 1/6")
          [[ "$out" == 1/2* ]] || { echo "calcy-cli printed '$out'"; exit 1; }
          "$app/Calcy" --version
          "$app/Calcy" --screenshot graphing "$PWD/shot-macos.png" --input "y = sin(x)"
          test -s shot-macos.png
          codesign --verify --deep --strict artifacts/work-osx-arm64/Calcy.app
      - name: Upload screenshot
        if: matrix.rid == 'win-x64' || matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.rid }}
          path: shot-*.png
          retention-days: 14
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.asc
          if-no-files-found: error
          retention-days: 30

  linux-install:
    name: Install on ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian 12, image: 'debian:12', kind: deb }
          - { name: Debian 13, image: 'debian:13', kind: deb }
          - { name: Ubuntu 22.04, image: 'ubuntu:22.04', kind: deb }
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', kind: deb }
          - { name: Fedora (latest), image: 'fedora:latest', kind: rpm }
          - { name: AlmaLinux 9 (RHEL 9), image: 'almalinux:9', kind: rpm }
          - { name: AlmaLinux 10 (RHEL 10), image: 'almalinux:10', kind: rpm }
          - { name: Rocky Linux 9 (RHEL 9), image: 'rockylinux/rockylinux:9', kind: rpm }
          - { name: CentOS Stream 10, image: 'quay.io/centos/centos:stream10', kind: rpm }
          # Red Hat's Universal Base Images are minimal container bases: their repositories may lack desktop
          # libraries (X11, fontconfig), so these runs report but never block a release. Full RHEL has them.
          - { name: Red Hat UBI 9, image: 'registry.access.redhat.com/ubi9/ubi:latest', kind: rpm, optional: true }
          - { name: Red Hat UBI 10, image: 'registry.access.redhat.com/ubi10/ubi:latest', kind: rpm, optional: true }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-x64
          path: packages
      - name: Check the signatures
        run: |
          set -eu
          if [ ! -f packages/calcy-signing-key.asc ]; then
            echo "::warning::The packages are not signed."
            exit 0
          fi
          if [ "${{ matrix.kind }}" = "deb" ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends gnupg
            export GNUPGHOME=$(mktemp -d)
            gpg --batch --import packages/calcy-signing-key.asc
            gpg --batch --verify packages/*.deb.asc packages/*.deb
          else
            # rpm checks the embedded signature against the imported key.
            rpm --import packages/calcy-signing-key.asc
            rpm --checksig packages/*.rpm | tee /dev/stderr | grep -q "signatures OK"
          fi
      - name: Install the .deb with its dependencies
        if: matrix.kind == 'deb'
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ./packages/*.deb fonts-dejavu-core
      - name: Install the .rpm with its dependencies
        if: matrix.kind == 'rpm'
        run: |
          set -eu
          dnf install -y ./packages/*.rpm
          dnf install -y dejavu-sans-fonts || dnf install -y dejavu-sans-mono-fonts || echo "No DejaVu fonts in this repository; using what is installed"
      - name: Run calcy-cli and render a screen
        run: |
          set -eu
          out=$(calcy-cli eval "1/3 + 1/6")
          echo "$out"
          case "$out" in 1/2*) ;; *) echo "calcy-cli printed '$out'"; exit 1 ;; esac
          calcy-cli eval "solve(x^2 - 5x + 6 = 0, x)"
          calcy --version
          calcy --screenshot advanced /tmp/shot.png --input "sqrt(72)"
          test -s /tmp/shot.png
          test -f /usr/share/applications/calcy.desktop

  release:
    name: Draft release
    if: inputs.create_release
    needs: [version, build, linux-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign the checksums
        env:
          SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::The LINUX_SIGNING_KEY secret is not set, so SHA256SUMS.txt is not signed."
            exit 0
          fi
          export GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --armor --detach-sign --output packages/SHA256SUMS.txt.asc packages/SHA256SUMS.txt
          gpg --batch --verify packages/SHA256SUMS.txt.asc packages/SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          flags=(--draft --target "${{ github.sha }}" --title "Calcy $version" --generate-notes)
          if [ "${{ inputs.channel }}" = "prerelease" ]; then flags+=(--prerelease); fi
          gh release create "v$version" "${flags[@]}" packages/*
